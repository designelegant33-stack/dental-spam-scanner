name: Dental Spam Scan

on:
  schedule:
    - cron: '0 6 * * 1'   # every Monday at 6am UTC
  workflow_dispatch:        # also allows manual trigger from GitHub UI

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium

      - name: Run spam scan
        run: python3 .github/scripts/scan_all.py > /tmp/scan_raw.json 2>/tmp/scan_log.txt
        continue-on-error: true

      - name: Generate report
        run: python3 .github/scripts/make_report.py /tmp/scan_raw.json

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "Automated spam scan $(date -u +%Y-%m-%d)"
          git push
